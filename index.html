<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Capricho de Costa del Silencio — Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oleo+Script:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#28282F;
    --ink:#161613;
    --card-bg:#F9F8F5;
    --page-bg:#E6E2DB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
  }

  .hero{
    min-height:38vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px 16px 18px; position:relative; overflow:hidden;
  }
  .hero img{ width:min(70vw,380px); position:relative; z-index:1; }

  nav{
    position:sticky; top:0; z-index:10;
    background:var(--card-bg);
    border-bottom:1px solid rgba(0,0,0,.08);
    display:flex; flex-wrap:nowrap; justify-content:flex-start;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    gap:4px; padding:10px 12px;
  }
  nav::-webkit-scrollbar{ display:none; }
  @media (min-width:720px){ nav{ flex-wrap:wrap; justify-content:center; overflow-x:visible; } }
  nav button{
    font-family:'Montserrat',sans-serif;
    font-weight:600; font-style:italic;
    font-size:12.5px; white-space:nowrap; flex:0 0 auto;
    background:rgba(0,0,0,.045); border:1px solid rgba(0,0,0,.06); cursor:pointer;
    color:var(--ink); opacity:.7;
    padding:8px 16px; border-radius:20px;
    margin:0 2px;
    transition:all .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  nav button:hover{ opacity:.95; background:rgba(0,0,0,.08); }
  nav button.active{ opacity:1; color:#fff; background:var(--accent); border-color:var(--accent); }

  main{ max-width:980px; margin:0 auto; padding:28px 16px 12px; }
  @media (min-width:600px){ main{ padding:40px 28px 20px; } }
  section{ display:none; }
  section.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .section-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px; gap:12px;
  }
  h1{
    font-family:'Oleo Script', cursive; font-weight:700;
    font-size:clamp(22px,6vw,38px); margin:0; color:var(--ink);
    text-transform:none; line-height:1.15;
  }
  .section-header img{ width:32px; opacity:.9; flex-shrink:0; }
  @media (min-width:600px){ .section-header{ margin-bottom:28px; } .section-header img{ width:40px; } }

  .grid{ display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:480px){ .grid{ grid-template-columns:repeat(2,1fr); gap:14px 16px; } }
  @media (min-width:860px){ .grid{ grid-template-columns:repeat(3,1fr); gap:14px 20px; } }

  .item{
    background:#fff; border-left:4px solid var(--accent);
    border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.06);
    padding:12px 16px;
  }
  .item h3{ font-weight:600; font-style:italic; font-size:14.5px; margin:0 0 6px; line-height:1.3; text-transform:none; }
  .item .price{ font-size:13.5px; opacity:.85; }

  footer{ margin-top:40px; padding:32px 16px 24px; text-align:center; }
  footer img{ width:min(65vw,220px); }
  footer .disclaimer{ margin-top:20px; font-size:11px; opacity:.55; max-width:520px; margin-left:auto; margin-right:auto; }
  footer .updated{ margin-top:10px; font-size:10.5px; opacity:.4; }
  @media (min-width:600px){ footer{ margin-top:56px; padding:40px 20px 30px; } footer .disclaimer{ margin-top:24px; } }

  .loading, .error{ text-align:center; padding:60px 20px; opacity:.6; font-style:italic; }

  /* Área táctil cómoda en móvil */
  @media (hover:none){ nav button{ padding:10px 16px; } }
</style>
</head>
<body>

<div class="hero">
  <img src="assets/logo-cover.svg" alt="El Capricho de Costa del Silencio — Gourmet, Catas & Tienda">
</div>

<nav id="nav"></nav>
<main id="main"><div class="loading">Cargando carta…</div></main>

<footer>
  <img src="assets/backcover.svg" alt="Contacto El Capricho de Costa del Silencio">
  <div class="disclaimer">Algunos platos pueden contener alérgenos. Consulta con el personal si tienes alguna intolerancia. Todos los precios incluyen IGIC.</div>
  <div class="updated" id="updated"></div>
</footer>

<script>
function cleanSectionName(raw){
  // Salvaguarda: por si alguna vez llega con el prefijo "Carta - " sin limpiar.
  return raw.replace(/^\s*carta\s*[-–—:]\s*/i, '').trim();
}

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

async function loadMenu(){
  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  const updated = document.getElementById('updated');
  try{
    const res = await fetch('menu-data.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('No se pudo cargar menu-data.json');
    const data = await res.json();

    main.innerHTML = '';
    nav.innerHTML = '';

    data.categories.forEach((cat, idx) => {
      const id = slugify(cat.category);

      const btn = document.createElement('button');
      btn.textContent = cleanSectionName(cat.category);
      btn.dataset.target = id;
      if (idx === 0) btn.classList.add('active');
      btn.addEventListener('click', () => showSection(id));
      nav.appendChild(btn);

      const sec = document.createElement('section');
      sec.id = id;
      if (idx === 0) sec.classList.add('active');

      const header = document.createElement('div');
      header.className = 'section-header';
      const h1 = document.createElement('h1');
      h1.textContent = cleanSectionName(cat.category);
      header.appendChild(h1);
      const img = document.createElement('img');
      img.src = 'assets/brandmark.svg';
      header.appendChild(img);
      sec.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.innerHTML = cat.items.map(it =>
        `<div class="item"><h3>${it.name}</h3><div class="price">${it.price} €</div></div>`
      ).join('');
      sec.appendChild(grid);

      main.appendChild(sec);
    });

    if (data.scraped_at){
      const d = new Date(data.scraped_at);
      updated.textContent = 'Carta actualizada: ' + d.toLocaleString('es-ES', { dateStyle:'long', timeStyle:'short' });
    }
  }catch(err){
    main.innerHTML = `<div class="error">No se pudo cargar la carta (${err.message}). Comprueba que menu-data.json existe junto a este archivo.</div>`;
  }
}

function showSection(id){
  document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.target === id));
  window.scrollTo({ top: document.getElementById('main').offsetTop - 70, behavior:'smooth' });
}

loadMenu();
</script>

</body>
</html>
