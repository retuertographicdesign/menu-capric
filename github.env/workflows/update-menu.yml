name: Actualizar carta desde Comandator

on:
  schedule:
    # Todos los días a las 06:00 UTC (07:00 / 08:00 hora canaria según horario de verano)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar scraper
        run: python scripts/scrape_menu.py

      - name: Publicar cambios si la carta cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu-data.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la carta."
          else
            git commit -m "Actualizar carta desde Comandator ($(date -u +%Y-%m-%d))"
            git push
          fi
